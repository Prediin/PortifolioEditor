name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check GitHub Pages publication mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).build_type||'unknown')}catch{console.log('unknown')}})" \
            || true)

          echo "GitHub Pages build_type: ${BUILD_TYPE:-unknown}"

          if [ "$BUILD_TYPE" = "legacy" ]; then
            echo "::warning title=GitHub Pages configurado incorretamente::O repositório ainda está em 'Deploy from a branch'. Isso cria o workflow automático pages-build-deployment e pode sobrescrever este deploy com o index.html fonte. Abra Settings > Pages > Build and deployment > Source e escolha 'GitHub Actions'."
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite application
        run: npm run build

      - name: Verify production build
        shell: bash
        run: |
          test -f dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "O build ainda referencia /src/main.jsx; isso não deveria acontecer."
            exit 1
          fi
          grep -q 'assets/' dist/index.html
          echo "Build de produção validado."
          find dist -maxdepth 2 -type f -print | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
