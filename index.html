<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080c" />
    <meta
      name="description"
      content="Portfólio de Pedro Luis Bezerra Lima — editor de vídeos para YouTube, conteúdo vertical, gameplay, vídeos comerciais e motion design."
    />
    <meta property="og:title" content="Pedro Luis — Editor de Vídeo" />
    <meta
      property="og:description"
      content="Edição com ritmo, intenção e personalidade para transformar material bruto em vídeo que prende atenção."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Pedro Luis — Editor de Vídeo</title>
    <style>
      html,body{margin:0;background:#05080c;color:#E9F1F7}
      .boot-fallback{min-height:100vh;display:grid;place-content:center;text-align:center;gap:10px;padding:28px;font-family:Arial,sans-serif}
      .boot-fallback strong{font-size:24px}.boot-fallback span{color:#78C0E0;font-size:13px;line-height:1.6}
      .boot-fallback a{display:none;margin:10px auto 0;width:max-content;padding:11px 14px;background:#ECA400;color:#071015;text-decoration:none;font-weight:800;font-size:12px;border-radius:10px}
      .boot-fallback.is-stuck a{display:inline-block}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status">
        <strong>Pedro Luis · Video Editor</strong>
        <span class="boot-message">Carregando portfólio…</span>
        <a href="https://github.com/Prediin/PortifolioEditor/settings/pages">Corrigir configuração do GitHub Pages</a>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.querySelector('.boot-fallback')
        if (!fallback) return
        fallback.classList.add('is-stuck')
        var message = fallback.querySelector('.boot-message')
        if (message) {
          message.textContent = 'O GitHub Pages está servindo os arquivos-fonte em vez do build do React. Em Settings → Pages, altere Source para GitHub Actions.'
        }
      }, 6500)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
